# Prevents Supabase free-tier project from pausing after 7 days of inactivity
# by running a lightweight DB query on a schedule (Mon & Thu 9:00 UTC).
#
# Setup:
# 1. In Supabase SQL Editor, run:
#    create table if not exists public._keepalive (id int primary key);
#    insert into public._keepalive values (1) on conflict (id) do nothing;
# 2. Add repository secrets: SUPABASE_URL, SUPABASE_ANON_KEY
#    (Dashboard → Project Settings → API: Project URL and anon public key)

name: Supabase keep-alive

on:
  schedule:
    - cron: "20 1 * * *"  # 1:20 AM UTC every day
  workflow_dispatch:  # Run manually from Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          resp=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Accept: application/json" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/_keepalive?select=id&limit=1")
          if [ "$resp" = "200" ]; then
            echo "Supabase keep-alive OK (HTTP $resp)"
          else
            echo "Unexpected response: HTTP $resp"
            exit 1
          fi
